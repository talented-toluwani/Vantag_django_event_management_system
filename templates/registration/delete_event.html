{% extends "base.html" %}

{% block content %}

<h1>Delete Event: {{ event.title }}</h1>
<h3> Are you sure you want to delete this event? This action cannot be reversed</h3>

<!-- Shows the deatils of the event to be deleted -->
{% include 'events/_event_card.html' %}
 
<form action="" method=post>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Yes, Delete Button?</button>
</form>
 
<!-- Cancel Link -->
<a href="{% url 'event-detail' event.pk%}">Event Details</a>

{% endblock content %}
