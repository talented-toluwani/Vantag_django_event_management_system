{% extends "base.html" %}

{% block title %}Set New Password{% endblock title %}

{% block content %}
<h2>Enter new password</h2>

{% if validlink %}
   <form action="" method="post">
       {% csrf_token %}
       {{ form.as_p }}
       <button type="Submit">Reset Password</button>
   </form>

{% else %}
<p>The reset link is invalid, or the has expired</p>
<a href="{% url 'password_reset' %}">Request a new link</a>

{% endif %}

{% endblock content %}
