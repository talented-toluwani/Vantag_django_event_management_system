{% extends "base.html" %}

{% block title %} Edit Events {% endblock title %}

{% block content %}

<h1>Edit event: {{event.title }}</h1>

<!-- Render global errors prominently at the top -->
{{ form.non_field_errors }}

<form action="" method=post>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit</button>
</form>

<!--Cancel Link-->
<a href="{% url 'event-detail' event.pk %}">Event Details</a>

{% endblock content %}
